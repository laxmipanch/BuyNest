<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuyNest — Shop</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────────────── -->
  <header class="header">
    <div class="header-inner">
      <a href="/index.html" class="logo">🛍️ BuyNest</a>

      <div class="header-search">
        <span class="search-icon">🔍</span>
        <input type="search" id="headerSearch" placeholder="Search products…" autocomplete="off" aria-label="Search products">
      </div>

      <nav class="header-nav">
        <a href="/index.html" class="active">Shop</a>
        <a href="/orders.html">Orders</a>
      </nav>

      <button class="cart-btn" id="cartToggleBtn" aria-label="Open cart">
        🛒
        <span class="cart-badge empty" id="cartBadge">0</span>
      </button>
    </div>
  </header>

  <!-- ── Cart Sidebar ────────────────────────────────────────────────── -->
  <div class="cart-overlay" id="cartOverlay" aria-hidden="true"></div>
  <aside class="cart-sidebar" id="cartSidebar" aria-label="Shopping cart">
    <div class="cart-sidebar-header">
      <h2>🛒 Shopping Cart</h2>
      <button class="cart-close-btn" id="cartCloseBtn" aria-label="Close cart">✕</button>
    </div>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-footer">
      <div class="cart-total-row">
        <span class="cart-total-label">Total</span>
        <span class="cart-total-amount" id="cartTotalAmount">$0.00</span>
      </div>
      <a href="/checkout.html" class="cart-checkout-btn" id="cartCheckoutBtn">Proceed to Checkout →</a>
    </div>
  </aside>

  <!-- ── Filter Bar ───────────────────────────────────────────────────── -->
  <div class="filter-bar">
    <div class="filter-inner">
      <div class="category-filters" role="group" aria-label="Filter by category">
        <button class="cat-btn active" data-category="All">All</button>
        <button class="cat-btn" data-category="Electronics">Electronics</button>
        <button class="cat-btn" data-category="Clothing">Clothing</button>
        <button class="cat-btn" data-category="Books">Books</button>
        <button class="cat-btn" data-category="Home &amp; Kitchen">Home &amp; Kitchen</button>
      </div>
      <div class="filter-divider" aria-hidden="true"></div>
      <select class="sort-select" id="sortSelect" aria-label="Sort products">
        <option value="newest">Newest</option>
        <option value="price-asc">Price: Low → High</option>
        <option value="price-desc">Price: High → Low</option>
      </select>
      <span class="results-count" id="resultsCount"></span>
    </div>
  </div>

  <!-- ── Products ─────────────────────────────────────────────────────── -->
  <main class="products-section">
    <div class="container">
      <div class="products-grid" id="productsGrid"></div>
    </div>
  </main>

  <!-- ── Footer ───────────────────────────────────────────────────────── -->
  <footer class="footer">
    <strong>BuyNest</strong> &copy; 2025 — A demo e-commerce app
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
