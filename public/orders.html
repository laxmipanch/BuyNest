<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order History — BuyNest</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────────────── -->
  <header class="header">
    <div class="header-inner">
      <a href="/index.html" class="logo">🛍️ BuyNest</a>

      <nav class="header-nav">
        <a href="/index.html">Shop</a>
        <a href="/orders.html" class="active">Orders</a>
      </nav>

      <button class="cart-btn" id="cartToggleBtn" aria-label="Open cart">
        🛒
        <span class="cart-badge empty" id="cartBadge">0</span>
      </button>
    </div>
  </header>

  <!-- ── Cart Sidebar ────────────────────────────────────────────────── -->
  <div class="cart-overlay" id="cartOverlay" aria-hidden="true"></div>
  <aside class="cart-sidebar" id="cartSidebar" aria-label="Shopping cart">
    <div class="cart-sidebar-header">
      <h2>🛒 Shopping Cart</h2>
      <button class="cart-close-btn" id="cartCloseBtn" aria-label="Close cart">✕</button>
    </div>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-footer">
      <div class="cart-total-row">
        <span class="cart-total-label">Total</span>
        <span class="cart-total-amount" id="cartTotalAmount">$0.00</span>
      </div>
      <a href="/checkout.html" class="cart-checkout-btn" id="cartCheckoutBtn">Proceed to Checkout →</a>
    </div>
  </aside>

  <!-- ── Page Banner ──────────────────────────────────────────────────── -->
  <div class="page-banner">
    <div class="container">
      <h1>Order History</h1>
      <p>All past orders placed through BuyNest</p>
    </div>
  </div>

  <!-- ── Orders List ──────────────────────────────────────────────────── -->
  <main class="orders-section">
    <div class="container">
      <div id="ordersContainer"></div>
    </div>
  </main>

  <!-- ── Footer ───────────────────────────────────────────────────────── -->
  <footer class="footer">
    <strong>BuyNest</strong> &copy; 2025 — A demo e-commerce app
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
